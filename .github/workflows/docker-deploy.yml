name: Build and Deploy Docker Image

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Build application
      run: npm run build

    - name: Run Playwright suite (E2E + API + visual + SSR)
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 14

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "docker-compose.yml"
        target: "~/demovic_net"

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script_stop: true
        script: |
          cd ~/demovic_net

          # Vytvor .env ak neexistuje
          if [ ! -f .env ]; then
            cat > .env << EOF
          NODE_ENV=production
          SITE_MODE=coming-soon
          SMTP_SERVER=${{ secrets.SMTP_SERVER }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          EOF
          fi

          # Aktualizuj docker-compose.yml aby pouzival image z GHCR
          sed -i 's|build: .|image: ghcr.io/${{ github.repository }}:latest|' docker-compose.yml

          # Login to GitHub Container Registry
          echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # Pull najnovsi image a restartuj kontajner (--wait caka na healthcheck)
          docker compose pull
          docker compose up -d --force-recreate --wait

          # Vycisti stare images
          docker image prune -f

          # Reload Nginx aby pouzival novu IP kontajnera
          sudo nginx -t && sudo systemctl reload nginx

          # Logout a vycisti ulozene credentials
          docker logout ghcr.io
          rm -f ~/.docker/config.json

    - name: Purge Cloudflare cache
      env:
        CF_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      run: |
        RESPONSE=$(curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H "X-Auth-Email: $CF_EMAIL" \
          -H "X-Auth-Key: $CF_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"purge_everything":true}')
        echo "$RESPONSE"
        if ! echo "$RESPONSE" | grep -Eq '"success":[[:space:]]*true'; then
          echo "Cloudflare cache purge failed"
          exit 1
        fi

    - name: Submit IndexNow for re-indexing
      run: |
        curl -s -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json" \
          -d '{
            "host": "demovic.net",
            "key": "540127ba5be96af6108bcfd9cf11edff",
            "keyLocation": "https://demovic.net/540127ba5be96af6108bcfd9cf11edff.txt",
            "urlList": [
              "https://demovic.net/"
            ]
          }'

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')

    steps:
    - name: Post-deploy smoke test against production
      run: |
        set -e
        code=$(curl -s -o /tmp/home.html -w "%{http_code}" https://demovic.net/)
        [ "$code" = "200" ] || { echo "expected 200 from demovic.net, got $code"; exit 1; }
        grep -q "emergency shell (dracut)" /tmp/home.html
        grep -q "demovic.net — coming soon" /tmp/home.html
        redirect=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "https://www.demovic.net/")
        echo "$redirect" | grep -q "^301 https://demovic.net/" || { echo "www redirect broken: $redirect"; exit 1; }
        echo "production smoke OK"
